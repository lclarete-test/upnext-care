name: UpNext TLS and protection readiness
on:
  push:
    paths: [.github/workflows/upnext-protection-readiness.yml]
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GD_TOKEN: ${{ secrets.GODADDY_API_TOKEN_UPNEXT }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - shell: python
        run: |
          import json,os,urllib.request,urllib.error
          def get(path):
              q=urllib.request.Request("https://api.cloudflare.com/client/v4/"+path,headers={"Authorization":"Bearer "+os.environ["CF_TOKEN"]})
              try:
                  with urllib.request.urlopen(q,timeout=20) as r: return json.load(r).get("result")
              except urllib.error.HTTPError as e:
                  print(path.split("/")[-1],"HTTP",e.code); return None
          z=get("zones?name=upnextcare.com")[0]; zid=z["id"]
          print("Zone status:",z["status"])
          ssl=get("zones/"+zid+"/settings/ssl")
          if ssl: print("SSL mode:",ssl.get("value"))
          certs=get("zones/"+zid+"/ssl/certificate_packs?status=all")
          if isinstance(certs,list): print("Certificate statuses:",[(c.get("type"),c.get("status")) for c in certs])
          bots=get("zones/"+zid+"/bot_management")
          if bots: print("Bot Fight Mode:",bots.get("fight_mode"))


          req=urllib.request.Request("https://api.godaddy.com/v3/domains/operations/f5eed732-0480-422c-8f16-a3e83bd5aa9c",headers={"Authorization":"Bearer "+os.environ["GD_TOKEN"]})
          with urllib.request.urlopen(req,timeout=20) as response:
              op=json.load(response); print("GoDaddy nameserver operation:",op.get("status"))
          req=urllib.request.Request("https://api.cloudflare.com/client/v4/zones/"+zid+"/activation_check",headers={"Authorization":"Bearer "+os.environ["CF_TOKEN"]},method="PUT")
          try:
              with urllib.request.urlopen(req,timeout=20) as response: print("Activation check requested:",json.load(response).get("success"))
          except urllib.error.HTTPError as e: print("Activation check HTTP:",e.code)
          if z.get("plan",{}).get("name","").lower() not in ("free","free website"): raise SystemExit("Free plan required.")
          if z["status"]=="active" and not bots.get("fight_mode"):
              req=urllib.request.Request("https://api.cloudflare.com/client/v4/zones/"+zid+"/bot_management",data=json.dumps({"fight_mode":True}).encode(),headers={"Authorization":"Bearer "+os.environ["CF_TOKEN"],"Content-Type":"application/json"},method="PUT")
              try:
                  with urllib.request.urlopen(req,timeout=20) as response: print("Bot protection update:",json.load(response).get("success"))
              except urllib.error.HTTPError as e: print("Bot protection HTTP:",e.code)
          print("Bot Fight Mode verified:",get("zones/"+zid+"/bot_management").get("fight_mode"))
