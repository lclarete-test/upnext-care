name: Verify UpNext protection read only
on:
  push:
    paths: [.github/workflows/upnext-protection-verify.yml]
  workflow_dispatch:
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - shell: python
        run: |
          import json,os,urllib.request
          def get(path):
              req=urllib.request.Request("https://api.cloudflare.com/client/v4/"+path,headers={"Authorization":"Bearer "+os.environ["CF_TOKEN"]})
              with urllib.request.urlopen(req,timeout=20) as r:
                  p=json.load(r)
                  if not p.get("success"): raise SystemExit("Read failed.")
                  return p["result"]
          z=get("zones?name=upnextcare.com")[0]; zid=z["id"]
          print("Zone:",z["status"],"Plan:",z["plan"]["name"])
          print("Bot Fight Mode:",get("zones/"+zid+"/bot_management").get("fight_mode"))
          print("SSL:",get("zones/"+zid+"/settings/ssl").get("value"))
          r=get("zones/"+zid+"/dns_records?per_page=500")
          web=[x for x in r if x["name"] in ("upnextcare.com","www.upnextcare.com") and x["type"] in ("A","AAAA","CNAME")]
          print("Website records:",len(web),"All proxied:",all(x.get("proxied") for x in web))
          print("Certificate statuses:",[x.get("status") for x in get("zones/"+zid+"/ssl/certificate_packs?status=all")])
          print("Read-only verification complete.")
