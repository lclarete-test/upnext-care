name: Activate UpNext Cloudflare nameservers
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: cloudflare-upnext
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GD_TOKEN: ${{ secrets.GODADDY_API_TOKEN_UPNEXT }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify DNS and activate Cloudflare nameservers
        shell: python
        run: |
          import json,os,sys,urllib.request,urllib.error
          domain="upnextcare.com"
          def api(host,path,token,method="GET",body=None):
              req=urllib.request.Request(host+path,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Content-Type":"application/json"},method=method)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
              except urllib.error.HTTPError as e: sys.exit("API request failed: HTTP "+str(e.code)+"; stopped without changing nameservers.")
          def cf(path,method="GET",body=None):
              r=api("https://api.cloudflare.com/client/v4/",path,os.environ["CF_TOKEN"],method,body)
              if not r.get("success"): sys.exit("Cloudflare API rejected operation.")
              return r["result"]
          zs=cf("zones?name="+domain)
          if len(zs)!=1: sys.exit("Expected exactly one zone.")
          z=zs[0]; zid=z["id"]
          if z.get("plan",{}).get("name","").lower() not in ("free","free website"): sys.exit("Free plan required.")
          gd=[]
          for p in range(1,101):
              page=api("https://api.godaddy.com/","v3/domains/zones/"+domain+"/dns-records?pageSize=100&page="+str(p),os.environ["GD_TOKEN"])
              items=page.get("items")
              if not isinstance(items,list): sys.exit("Invalid DNS response.")
              gd+=items
              if len(items)<100: break
          else: sys.exit("DNS pagination limit.")
          def fq(n): return domain if n=="@" else (n.rstrip(".") if n.rstrip(".").endswith("."+domain) else n.rstrip(".")+"."+domain)
          desired=[]
          for r in gd:
              t=r["type"]
              if t=="SOA" or (t=="NS" and r["name"]=="@"): continue
              if t not in ("A","AAAA","CNAME","MX","TXT","SRV","CAA","NS"): sys.exit("Unsupported DNS type; no cutover.")
              n=fq(r["name"])
              b={"type":t,"name":n,"ttl":r["ttl"]}
              if t=="SRV":
                  service=r.get("service",""); protocol=r.get("protocol","")
                  if service and protocol and not n.startswith(service+"."+protocol+"."): n=service+"."+protocol+"."+n
                  b["name"]=n
                  b["data"]={"priority":int(r["priority"]),"weight":int(r["weight"]),"port":int(r["port"]),"target":r["data"].rstrip(".")}
              elif t=="CAA": b["data"]={"flags":int(r.get("flag",0)),"tag":r["tag"],"value":r["data"]}
              else:
                  b["content"]=r["data"].rstrip(".") if t in ("CNAME","MX","NS") else r["data"]
                  if t=="MX": b["priority"]=int(r["priority"])
              if t in ("A","AAAA","CNAME"): b["proxied"]=False
              desired.append(b)
          if not any(r["type"]=="MX" for r in desired): sys.exit("Missing mail records.")
          if not any(r["type"]=="A" and r["name"]==domain for r in desired): sys.exit("Missing website records.")
          def key(r):
              d=r.get("data",{})
              if r["type"]=="SRV": value=tuple(str(d.get(k,"")).rstrip(".") for k in ("priority","weight","port","target"))
              elif r["type"]=="CAA": value=tuple(str(d.get(k,"")) for k in ("flags","tag","value"))
              else: value=(r.get("content","").rstrip(".") if r["type"] in ("CNAME","MX","NS") else r.get("content",""),str(r.get("priority","")) if r["type"]=="MX" else "")
              return (r["type"],r["name"].rstrip(".").lower(),value)
          existing=cf("zones/"+zid+"/dns_records?per_page=500")
          wanted={key(r) for r in desired}
          extras=[r for r in existing if key(r) not in wanted]
          if extras: sys.exit("Unexpected destination records; review needed before importing.")
          have={key(r) for r in existing}
          for b in desired:
              if key(b) not in have:
                  cf("zones/"+zid+"/dns_records","POST",b); have.add(key(b))
          after=cf("zones/"+zid+"/dns_records?per_page=500")
          if {key(r) for r in after}!=wanted: sys.exit("DNS comparison failed; nameservers unchanged.")
          print("Verified DNS copy:",len(desired),"records. Website and email records preserved.")
          print("All website records remain DNS-only until HTTPS and cutover checks.")
          print("Nameservers unchanged. No billing changes.")

          ds=api("https://dns.google/","resolve?name="+domain+"&type=DS","")
          if ds.get("Status")!=0 or any(x.get("type")==43 for x in ds.get("Answer",[])): sys.exit("DNSSEC status requires review; nameservers unchanged.")
          ns=z.get("name_servers",[])
          if len(ns)!=2 or not all(x.endswith(".ns.cloudflare.com") for x in ns): sys.exit("Invalid target nameservers.")
          result=api("https://api.godaddy.com/","v3/domains/domain-names/"+domain+"/nameservers",os.environ["GD_TOKEN"],"PUT",ns)
          print("GoDaddy accepted the Cloudflare nameserver change.")
          print("Target nameservers:",", ".join(ns))
